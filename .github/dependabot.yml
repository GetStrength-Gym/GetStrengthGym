# Weekly update PRs for the site's packages and for the SHA-pinned Actions (ADR-008).
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # react-dom requires the matching react version, so they must move together.
      react:
        patterns:
          - react
          - react-dom
    ignore:
      # The types must match the Node 22 runtime (Dockerfile and workflows).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
